<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - Game Hub</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="site-header">
  <div class="container">
    <nav class="navbar navbar-expand-lg">
      <a class="logo" href="index.html">GAME HUB</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="nav-links navbar-nav ms-auto">
          <li><a href="index.html">Home</a></li>
          <li><a href="clubs.html">Clubs & Map</a></li>
          <li><a href="bookings.html">My Bookings</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </div>
    </nav>
  </div>
</header>

<main class="container py-5">

  <div class="section-title">
    <h1>My Bookings</h1>
    <p>Here you can see and cancel your reservations.</p>
  </div>

  <div id="bookingsContainer"></div>

</main>

<footer class="site-footer">
  <div class="container text-center py-4">
    <p>Midterm project - Sultan Nurlybek & Amur Kudaibergen</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

  function getBookings() {
    return JSON.parse(localStorage.getItem("gameHubBookings") || "[]");
  }

  function saveBookings(bookings) {
    localStorage.setItem(
      "gameHubBookings",
      JSON.stringify(bookings)
    );
  }

  function renderBookings() {

    const container = document.getElementById("bookingsContainer");

    const bookings = getBookings();

    container.innerHTML = "";

    if (bookings.length === 0) {

      container.innerHTML = `
            <div class="empty-state">
                <h2>No bookings yet</h2>
                <p>You have not booked any gaming sessions.</p>
                <a href="clubs.html" class="btn btn-primary">
                    Find a Club
                </a>
            </div>
        `;

      return;
    }

    bookings
      .slice()
      .reverse()
      .forEach(booking => {

        const item = document.createElement("article");

        item.className = "booking-item";

        item.innerHTML = `
                <div class="booking-item-header">
                    <div>
                        <h2>${booking.club}</h2>
                        <p class="text-muted mb-0">${booking.pc}</p>
                    </div>

                    <button
                        class="btn btn-outline-danger btn-sm cancel-button"
                        data-id="${booking.id}"
                    >
                        Cancel
                    </button>
                </div>

                <div class="booking-info">

                    <div>
                        <span>Date</span>
                        <strong>${booking.date}</strong>
                    </div>

                    <div>
                        <span>Time</span>
                        <strong>${booking.start} - ${booking.end}</strong>
                    </div>

                    <div>
                        <span>Duration</span>
                        <strong>${booking.hours} hour(s)</strong>
                    </div>

                    <div>
                        <span>Total</span>
                        <strong>${Number(booking.price).toLocaleString()} ₸</strong>
                    </div>

                    <div>
                        <span>Deposit</span>
                        <strong>${Number(booking.deposit).toLocaleString()} ₸</strong>
                    </div>

                    <div>
                        <span>Status</span>
                        <strong class="text-success">Confirmed</strong>
                    </div>

                </div>
            `;

        container.appendChild(item);
      });

    document.querySelectorAll(".cancel-button").forEach(button => {

      button.addEventListener("click", function() {

        const id = Number(button.dataset.id);

        const updated =
          getBookings().filter(booking => booking.id !== id);

        saveBookings(updated);

        renderBookings();
      });

    });
  }

  renderBookings();

</script>

</body>
</html>
